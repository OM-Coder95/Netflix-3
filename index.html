<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container pt-5 mb-5">
        <div class="row">
            <div class="col-6">
                <a href="index.html" class="logo"><img src="./assets/img/netflixLogo.svg" alt="NetflixLogo"
                        title="NetflixLogo"></a>
            </div>
            <div class="col-6 text-right align-self-center">
                <button class="btn btn-sm net-pri-btn" id="showMovieModal">Add Movie</button>
            </div>
        </div>
    </div>

    <!-- Movie Card -->
    <div class="container-fluid">
        <div class="row" id="movieCardContainer">

        </div>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="movieModal" id="movieModal">
        <form id="form">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h4 class="m-0">Add Movie</h4>
                    <i role="button" class="fa-solid fa-xmark fa-2x" id="closeMovieModalIcon"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="original_title">Movie Name</label>
                        <input type="text" class="form-control" id="original_title">
                    </div>
                    <div class="form-group">
                        <label for="backdrop_path">Movie Image</label>
                        <input type="text" class="form-control" id="backdrop_path">
                    </div>
                    <div class="form-group">
                        <label for="overview">Movie Description</label>
                        <textarea class="form-control" rows="3" id="overview"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="vote_average">Movie Rating</label>
                        <input type="number" class="form-control" id="vote_average" min="0" max="9" step="0.1">
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm net-sec-btn" id="addMovieBtn">Add Movie</button>
                    <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateMovieBtn">Update
                        Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn" id="movieModalCloseBtn">Close</button>
                </div>
            </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
