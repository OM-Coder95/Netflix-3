    <div class="backdrop" id="backdrop"></div>

    <div class="movieModal" id="movieModal">
        <form id="form">
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <h4 class="m-0">Add Movie</h4>
                    <i role="button" class="fa-solid fa-xmark fa-2x" id="closeMovieModalIcon"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="original_title">Movie Name</label>
                        <input type="text" class="form-control" id="original_title">
                    </div>
                    <div class="form-group">
                        <label for="backdrop_path">Movie Image</label>
                        <input type="text" class="form-control" id="backdrop_path">
                    </div>
                    <div class="form-group">
                        <label for="overview">Movie Description</label>
                        <textarea class="form-control" rows="3" id="overview"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="vote_average">Movie Rating</label>
                        <select class="form-control" id="vote_average">
                            <option value="">Select Rating</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm net-sec-btn" id="addMovieBtn">Add Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn" id="movieModalCloseBtn">Close</button>
                </div>
            </div>
        </form>
    </div>
